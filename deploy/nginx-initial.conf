# TEMPORARY config used only for the very first boot, before a TLS cert
# exists — nginx will refuse to start if the real nginx.conf's `ssl_certificate`
# paths don't exist yet. Use this to serve the ACME HTTP-01 challenge, get
# the cert with certbot, then switch to nginx.conf (see deploy guide).

server {
    listen 80;
    server_name 100bid.lol www.100bid.lol;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'ok - waiting for TLS setup';
        add_header Content-Type text/plain;
    }
}
