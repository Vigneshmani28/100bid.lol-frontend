# Final config — used once the TLS cert exists (see deploy guide for the
# certbot bootstrap step that must run before switching to this file).

server {
    listen 80;
    server_name 100bid.lol www.100bid.lol;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 100bid.lol www.100bid.lol;

    ssl_certificate     /etc/letsencrypt/live/100bid.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/100bid.lol/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    # A static "proxy_pass http://backend:4000;" only resolves the hostname
    # once, at nginx startup — a later redeploy that recreates the backend
    # or frontend container (new internal IP) leaves nginx silently proxying
    # to a dead IP until it's manually restarted (502 Bad Gateway). Routing
    # through a variable forces nginx to re-resolve via Docker's embedded
    # DNS (127.0.0.11) on every request instead, respecting the resolver's
    # TTL — so nginx notices a redeployed backend/frontend on its own.
    resolver 127.0.0.11 valid=10s;

    # No trailing path after the port — nginx forwards the original request
    # URI unchanged, matching Express's /api and /uploads mount points.
    location /api/ {
        set $backend_upstream backend:4000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        set $backend_upstream backend:4000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
    }

    location / {
        set $frontend_upstream frontend:3000;
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
